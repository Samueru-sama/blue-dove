# onelf recipe for the portable Linux bundle. scripts/package-onelf.sh
# copies it into the AppDir and writes the release version over the
# placeholder below.
[package]
name = "blue-dove"
command = "bin/blue-dove"
output = "blue-dove.onelf"
version = "0.0.0"
description = "A fast music player with an album browser and waveform seekbar"
license = "MIT"
homepage = "https://github.com/pkgforge-apps/blue-dove"

[compression]
level = 22
payload = "stipple"

[bundle]
strip = true
scan-dlopen = true
exclude = ["libdecor"]
